# Droplet stack: Caddy (HTTPS for three hostnames), the front desk server, n8n.
#   DOMAIN          demo page (static, ./public)
#   desk.DOMAIN     the front desk server (Retell tools and webhooks, Stripe webhook, pay links)
#   n8n.DOMAIN      n8n (CRM, team email, GoHighLevel)
# Secrets come from .env (never committed). The Google key file is mounted read-only from ./secrets.
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
      DB_FILE: /var/lib/frontdesk/frontdesk.db
      GOOGLE_SERVICE_ACCOUNT_FILE: /run/secrets-dir/google-service-account.json
    volumes:
      - frontdesk_data:/var/lib/frontdesk
      - ./secrets:/run/secrets-dir:ro
    expose: ["8080"]
    mem_limit: 300m

  n8n:
    image: docker.n8n.io/n8nio/n8n:stable
    restart: unless-stopped
    environment:
      N8N_HOST: n8n.${DOMAIN}
      N8N_PROTOCOL: https
      N8N_PORT: "5678"
      WEBHOOK_URL: https://n8n.${DOMAIN}/
      N8N_EDITOR_BASE_URL: https://n8n.${DOMAIN}/
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      GENERIC_TIMEZONE: America/New_York
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_RUNNERS_ENABLED: "true"
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "336"
    volumes:
      - n8n_data:/home/node/.n8n
    expose: ["5678"]
    mem_limit: 900m

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./public:/srv/site:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app, n8n]

volumes:
  frontdesk_data:
  n8n_data:
  caddy_data:
  caddy_config:
